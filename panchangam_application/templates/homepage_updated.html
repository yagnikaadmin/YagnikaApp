<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panchangam Dynamic Sky & Kala Chakra Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Sans+Telugu:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Roboto', 'Noto Sans Telugu', sans-serif;
      overflow-x: hidden;
      overflow-y: auto; /* Enables natural scrolling */
    }

    /* 1. VIEWPORT & BACKGROUND LAYERS */
    .sky-viewport {
      position: relative;
      width: 100vw;
      min-height: 100vh; /* Allows content to push height dynamically */
      overflow-x: hidden;
    }

    .bg-layer {
      position: fixed; /* Keeps skies locked to the screen while you scroll */
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover; 
      background-position: center center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      z-index: 1;
    }

    .bg-morning   { background-image: url('/static/HomePage_Morning.webp'); }
    .bg-afternoon { background-image: url('/static/HomePage_Afternoon.webp'); }
    .bg-evening   { background-image: url('/static/HomePage_Evening.webp'); }
    .bg-night     { background-image: url('/static/HomePage_Night.webp'); }

    .bg-layer.active {
      opacity: 1;
    }

    /* 2. NAVBAR */
/* 2. NAVBAR */
    .main-navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: clamp(55px, 8vh, 70px); /* Dynamically sizes the navbar height */
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 3%; 
      transition: background-color 1s ease, border-color 1s ease;
    }

    .brand-container {
      display: flex;
      align-items: center;
      height: 150%;
      gap: clamp(10px, 1.5vw, 20px);
    }

    .main-navbar.day-theme {
      background: rgba(255, 248, 235, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(128, 0, 0, 0.15);
    }

    .main-navbar.day-theme .nav-links a,
    .main-navbar.day-theme .lang-dropdown-btn,
    .main-navbar.day-theme .nav-timings {
      color: #4a0000;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7);
    }

    .main-navbar.day-theme .nav-links a:hover,
    .main-navbar.day-theme .nav-links a.active {
      color: #800000;
      border-bottom: 2px solid #800000;
    }

    .main-navbar.night-theme {
      background: rgba(10, 10, 20, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .main-navbar.night-theme .nav-links a,
    .main-navbar.night-theme .lang-dropdown-btn,
    .main-navbar.night-theme .nav-timings {
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .main-navbar.night-theme .nav-links a:hover,
    .main-navbar.night-theme .nav-links a.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      height: 150%;
      text-decoration: none;
    }

    .logo-img {
      height: clamp(65px, 9vh, 95px); /* Increased size significantly */
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
      margin-left: -5px; /* Optional: nudges it slightly left if the larger size pushes it too far in */
    }

    /* Slightly smaller, dynamic text for timings */
    .nav-timings { 
        display: flex; 
        align-items: center; 
        gap: clamp(8px, 1.2vw, 15px); 
        font-size: clamp(11px, 1.2vw, 15px); 
        font-weight: 700; 
        letter-spacing: 0.5px; 
        transition: color 1s ease; 
    }
    .timing-item { display: flex; align-items: center; gap: 4px; }

    .nav-links {
      display: flex;
      list-style: none;
      align-items: center;
      height: 100%;
      gap: clamp(12px, 1.8vw, 24px);
    }

    /* Dynamic scaling for Nav Links & Language Dropdown */
    .nav-links a {
      font-size: clamp(13px, 1.4vw, 17px); 
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.8px;
      padding-bottom: 3px;
      transition: color 0.3s ease, border-color 0.3s ease;
      border-bottom: 2px solid transparent;
    }

    .lang-dropdown { position: relative; display: inline-block; }
    .lang-dropdown-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: clamp(13px, 1.4vw, 17px); 
      font-weight: 700;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-bottom: 3px;
    }

    .lang-dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background-color: rgba(20, 20, 30, 0.95);
      min-width: 120px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
      border-radius: 8px;
      overflow: hidden;
      z-index: 101;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .lang-dropdown-content button {
      color: #fff;
      padding: 10px 16px;
      text-decoration: none;
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px; 
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .lang-dropdown-content button:hover { background-color: rgba(212, 175, 55, 0.3); }
    .lang-dropdown:hover .lang-dropdown-content { display: block; }

    /* Dynamically scaled celestial icons */
    .celestial-icon {
        width: clamp(16px, 2vw, 24px);
        object-fit: contain;
        display: inline-block;
        vertical-align: middle;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
    }

    /* --- RESPONSIVE LOGIC ADJUSTMENTS FOR MOBILE / PORTRAIT --- */
    /* --- RESPONSIVE LOGIC ADJUSTMENTS FOR MOBILE / PORTRAIT --- */
    @media (max-width: 1250px), (orientation: portrait) { 
        .main-wrapper {
            justify-content: flex-start; 
            padding-top: 150px; /* Increased to account for the taller navbar */
            padding-bottom: 40px;
        }
        .celestial-sky-box {
            top: 110px; /* Pushes the sun/moon track below the navbar */
        }
        .content-row { 
            display: flex; 
            flex-direction: column; 
            padding-top: 0; 
            gap: 60px; 
        } 
        .left-spacer {
            display: none;
        }
        .right-column { 
            position: relative; 
            right: auto; 
            top: auto; 
            transform: none; 
            justify-content: center;
            width: 100%;
        }
        .panchangam-clock-container {
            width: min(85vw, 450px);
            height: min(85vw, 450px);
        }
        .shloka-container {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            margin-top: 50px;
            margin-bottom: 20px;
            width: 100%;
        }
    }

    @media (max-width: 768px) { 
        .main-navbar { height: auto; padding: 10px 3%; flex-wrap: wrap; } 
        .brand-container { width: 100%; justify-content: space-between; margin-bottom: 8px; } 
        .logo-img { height: 65px; } 
        .nav-links { gap: 12px; }
        .nav-timings { 
            order: 3; 
            width: 100%; 
            justify-content: center; 
            margin-top: 8px; 
            flex-wrap: wrap; 
            font-size: 12px;
            gap: 10px;
        } 
        .celestial-icon { width: 15px; }

        /* Mobile specific spacing to clear the 3-row wrapped navbar */
        .celestial-sky-box {
            top: 150px; /* Pushes sun/moon clearly below the mobile nav */
        }
        .main-wrapper {
            padding-top: 180px; /* Pushes the book clearly below the nav */
        }
    }

    /* 3. CELESTIAL SKY TRACKING */
    .celestial-sky-box {
      position: fixed; /* Keeps Sun & Moon relative to viewport */
      top: 10vh;
      left: 0;
      width: 100vw;
      height: 120px;
      z-index: 15;
      pointer-events: none;
      overflow: visible;
    }

    .sun {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 20%, #fff280 50%, #ffaa00 100%);
      box-shadow: 0 0 40px #ffaa00, 0 0 80px #ff7700;
      will-change: transform;
    }

    .moon-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 80px;
      height: 80px;
      will-change: transform;
    }

    .moon-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fdfdfd;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
      overflow: hidden;
    }

    .moon-shadow {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background: #080a10;
      border-radius: 50%;
      transition: transform 0.05s linear;
    }

    /* 4. MAIN PANCHANGAM BOOK CONTAINER - LANDSCAPE GRID */
    .main-wrapper {
      position: relative;
      z-index: 20;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;    
      justify-content: center; 
      /* Dynamic padding perfectly balances the space between the navbar and the bottom shloka */
      padding-top: max(80px, 10vh);
      padding-bottom: max(100px, 12vh);
    }

    .content-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr; /* This enforces strict dead-center for the book */
      align-items: center;
      width: 100%;
      max-width: 1600px;
      padding: 0 3vw;
      gap: 20px;
    }

    .left-spacer { grid-column: 1; }

    .left-column { 
      grid-column: 2; /* EXACT Center */
      display: flex; flex-direction: column; align-items: center; gap: 24px; 
      width: 100%; max-width: 550px; 
      z-index: 10;
    }

    .right-column { 
      grid-column: 3; /* EXTREME Right */
      display: flex; justify-content: flex-end; align-items: center; 
      z-index: 5;
    }

    .panchangam-book {
      position: relative;
      z-index: 60;
      width: 100%;
      display: flex;
      border-radius: 12px;
      padding: 24px clamp(16px, 2.2vw, 30px);
      transition: background 1s ease, border-color 1s ease, color 1s ease, box-shadow 1s ease;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .panchangam-book::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, rgba(212, 175, 55, 0.5), transparent);
      z-index: 5;
    }

    .book-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid #d4af37;
      pointer-events: none;
    }
    .top-left { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .top-right { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .bottom-right { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    .book-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 8px;
    }

    .book-page.left-page {
      text-align: center;
      border-right: 1px dashed rgba(212, 175, 55, 0.3);
      padding-right: clamp(10px, 1.5vw, 18px);
      align-items: center;
    }

    .book-page.right-page {
      padding-left: clamp(10px, 1.5vw, 18px);
    }

    .panchangam-book.day-theme {
      background: rgba(255, 248, 230, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(128, 0, 0, 0.3);
      color: #4a0000;
      box-shadow: 0 15px 35px rgba(128, 0, 0, 0.15), inset 0 0 25px rgba(255, 255, 255, 0.3);
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .panchangam-book.day-theme .sub-heading {
      border-bottom-color: rgba(128, 0, 0, 0.3);
      color: #700000;
    }

    .panchangam-book.day-theme .panchangam-row {
      border-bottom: 1px dashed rgba(128, 0, 0, 0.2);
    }

    .panchangam-book.night-theme {
      background: rgba(10, 12, 24, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(255, 255, 255, 0.08);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .panchangam-book.night-theme .sub-heading {
      border-bottom-color: rgba(255, 255, 255, 0.35);
      color: #ffffff;
    }

    .panchangam-book.night-theme .panchangam-row {
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
    }

    .main-heading {
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
      line-height: 1.2;
    }

    .sub-heading {
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      opacity: 0.95;
      border-bottom: 1.5px solid;
      padding-bottom: 3px;
      display: inline-block;
    }

    .date-badge {
      font-size: clamp(11px, 1vw, 13px);
      font-weight: 800;
      margin: 6px 0 10px 0;
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(212, 175, 55, 0.2);
      border: 1px solid rgba(212, 175, 55, 0.5);
      display: inline-block;
      letter-spacing: 0.5px;
    }

    .om-logo-img {
      max-width: clamp(45px, 5vw, 65px);
      height: auto;
      object-fit: contain;
      margin-top: 4px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
    }

    .panchangam-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: clamp(11px, 0.9vw, 13.5px);
      font-weight: 500;
    }

    .panchangam-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 3px;
    }

    .panchangam-row:last-child {
      border-bottom: none;
    }

    .panchangam-label { font-weight: 700; opacity: 0.9; }
    .panchangam-value { font-weight: 700; }

    .panchangam-actions {
      display:flex; gap:15px; align-items:center; justify-content:center; flex-wrap:wrap; margin-bottom: 10px; width: 100%;
    }

    .btn-full-panchangam {
      position: relative; display: inline-flex; align-items: center; justify-content: center; padding: 12px 32px; font-size: clamp(13px, 1.1vw, 15px); font-weight: 800; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; color: #ffffff; background: linear-gradient(135deg, #800000 0%, #4a0000 100%); border: 1.5px solid #d4af37; border-radius: 25px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(212, 175, 55, 0.3); cursor: pointer; transition: all 0.3s ease; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
    .btn-full-panchangam:hover { transform: translateY(-2px); background: linear-gradient(135deg, #a00000 0%, #600000 100%); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.5); border-color: #ffd700; }

    /* 5. KALA CHAKRA WHEEL - SMALLER SIZE */
    .panchangam-clock-container {
      position: relative; margin: 0; width: min(70vw, 60vh, 500px); height: min(70vw, 60vh, 500px); z-index: 50; display: flex; justify-content: center; align-items: center; border-radius: 50%; background: radial-gradient(circle, #2a0804 0%, #150301 70%, #050100 100%); border: clamp(4px, 1vw, 8px) solid #d4af37; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.95), 0 0 30px rgba(212, 175, 55, 0.3), inset 0 0 25px #000; flex-shrink: 0; 
    }
    .clock-pointer { position: absolute; top: -14px; width: 0; height: 0; border-left: clamp(10px, 1.5vw, 14px) solid transparent; border-right: clamp(10px, 1.5vw, 14px) solid transparent; border-top: clamp(20px, 3vw, 30px) solid #ffd700; z-index: 70; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.95)); }
    .clock-pointer::after { content: ''; position: absolute; top: -25px; left: -6px; width: 12px; height: 12px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
    .outer-brass-ring { position: absolute; width: 96%; height: 96%; border-radius: 50%; border: 2px solid rgba(212, 175, 55, 0.5); box-shadow: inset 0 0 15px rgba(0,0,0,0.8); pointer-events: none; }
    
    .outer-wheel { position: absolute; width: 95%; height: 95%; border-radius: 50%; }
    
    .time-spoke { position: absolute; top: 0; left: 50%; width: 30%; height: 50%; margin-left: -15%; transform-origin: bottom center; display: flex; justify-content: center; align-items: flex-start; padding-top: 10%; transition: all 0.5s ease; }
    .upright-content { text-align: center; transform-origin: center center; transition: all 0.5s ease; }
    .label-title { font-size: clamp(12px, 1.2vw, 10px); font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; display: block; line-height: 1.1; margin-bottom: 3px; }
    .label-time { font-size: clamp(10px, 1vw, 10px); font-weight: 700; display: block; opacity: 0.95; letter-spacing: 0.2px; text-align: center; line-height: 1.3;}
    
    /* Kalas Colors */
    .auspicious .label-title { color: #5cdb95; text-shadow: 0 0 6px rgba(0, 255, 100, 0.6); }
    .auspicious .label-time { color: #d4f8e8; }
    .inauspicious .label-title { color: #ff6b6b; text-shadow: 0 0 6px rgba(255, 0, 0, 0.6); }
    .inauspicious .label-time { color: #ffd1d1; }

    .time-spoke.active-kala .upright-content { border: 2px solid #ffd700; transform: scale(1.15); box-shadow: 0 0 15px #ffd700; border-radius: 8px; padding: 5px; background: rgba(0, 0, 0, 0.85); }

    .inner-wheel { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: radial-gradient(circle, #3a0d04 0%, #1a0501 60%, #050100 100%); border: 3px solid #ffd700; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 60; box-shadow: 0 0 25px rgba(0, 0, 0, 0.95), inset 0 0 15px #b8860b; padding: 12px; text-align: center; overflow: hidden; }
    .date-display { font-size: clamp(7px, 0.8vw, 9px); color: #d4af37; margin-top: 1px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
    .digital-time { font-size: clamp(10px, 1.3vw, 14px); color: #ffd700; font-weight: 700; letter-spacing: 0.5px; text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); margin: 4px 0; line-height: 1.3; max-width: 95%; word-wrap: break-word;}
    .period-status { font-size: clamp(8px, 0.9vw, 10px); font-weight: 700; letter-spacing: 0.5px; padding: 2px 6px; border-radius: 12px; background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(212, 175, 55, 0.6); color: #ffd700; text-shadow: 0 0 6px rgba(255, 215, 0, 0.5); text-align: center; }

    .date-picker { border-radius: 2px 18px 2px 18px; padding: 10px 15px 10px 45px; min-width: 200px; border: 1px solid #5a3d06; background: radial-gradient(circle at 20px 50%, #1a0c02 5px, transparent 6px), repeating-linear-gradient(to bottom, transparent, transparent 3px, rgba(90, 61, 6, 0.15) 4px, rgba(90, 61, 6, 0.05) 5px), linear-gradient(to right, #b8860b, #e3c887 10%, #d4af37 50%, #e3c887 90%, #b8860b); color: #2a1405; font-size: 15px; font-weight: 800; font-family: 'Noto Sans Telugu', serif; letter-spacing: 1px; box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(90, 61, 6, 0.4); outline: none; cursor: pointer; }
    .date-picker::-webkit-calendar-picker-indicator { filter: invert(15%) sepia(85%) saturate(400%) hue-rotate(345deg) brightness(50%) contrast(100%); cursor: pointer; }

    /* Icon styling for celestial timings */
    .celestial-icon {
        width: clamp(18px, 3vw, 40px);
        object-fit: contain;
        display: inline-block;
        vertical-align: middle;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
    }
    
    /* Shloka Container - Positioned absolutely at the bottom center for Landscape */
    .shloka-container {
      position: absolute;
      bottom: max(20px, 3vh); 
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 50;
    }

    .shloka-bottom {
      text-align: center;
      font-size: clamp(12px, 2vw, 30px);
      font-weight: 800;
      line-height: 1.6;
      letter-spacing: 0.5px;
      transition: color 1s ease, text-shadow 1s ease;
      padding: 8px 0; 
    }

    .shloka-bottom.day-theme {
      color: #4a0000;
      text-shadow: 0 1px 3px rgba(255, 255, 255, 0.9);
    }

    .shloka-bottom.night-theme {
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .shloka-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      color: #d4af37; 
      font-size: 14px;
    }

    .shloka-divider::before,
    .shloka-divider::after {
      content: '';
      flex: 1;
      height: 1.5px;
      margin: 0 15px;
    }

    .shloka-divider::before {
      background: linear-gradient(to right, transparent, rgba(212, 175, 55, 0.8));
    }

<body>

  <script>
    let currentLang = 'en';
    let currentPanchangam = null;
    let currentTimeout = null;
    let isOpeningComplete = false;
    let currentCalendarType = 'suryamana'; 

    const i18n = {
      en: {
        navHome: "Home", navPanchangam: "Panchangam", langBtn: "Languages ▼",
        goodMorning: "Good Morning", goodAfternoon: "Good Afternoon", goodEvening: "Good Evening", goodNight: "Good Night",
        subHeading: "Today's Yagnika Panchangam", lblSamvatsaram: "Samvatsaram:", lblAyanam: "Ayanam:", lblRithuvu: "Rithuvu:",
        lblMasam: "Masam:", lblPaksham: "Paksham:", lblThidhi: "Thidhi:", lblNakshatram: "Nakshatram:",
        btnFullPanchangam: "Get Panchangam", kalaChakram: "Kala Chakram", sunrise: "Sunrise", sunset: "Sunset", moonrise: "Moonrise", moonset: "Moonset",
        suryamana: "Suryamana", amanta: "Chandramana Amanta", purnimanta: "Chandramana Purnimanta",
        lblMasamSuryamana: "Saura Masam", lblMasamAmanta: "Amanta Masam", lblMasamPurnimanta: "Purnimanta Masam"
      },
      te: {
        navHome: "ముఖ్య పుట", navPanchangam: "పంచాంగం", langBtn: "భాషలు ▼",
        goodMorning: "శుభోదయం", goodAfternoon: "శుభ మధ్యాహ్నం", goodEvening: "శుభ సాయంత్రం", goodNight: "శుభ రాత్రి",
        subHeading: "నేటి యాజ్ఞిక పంచాంగం", lblSamvatsaram: "సంవత్సరం:", lblAyanam: "అయనం:", lblRithuvu: "ఋతువు:",
        lblMasam: "మాసం:", lblPaksham: "పక్షం:", lblThidhi: "తిథి:", lblNakshatram: "నక్షత్రం:",
        btnFullPanchangam: "సంపూర్ణ పంచాంగం", kalaChakram: "కాల చక్రం", sunrise: "సూర్యోదయం", sunset: "సూర్యాస్తమయం", moonrise: "చంద్రోదయం", moonset: "చంద్రాస్తమయం",
        suryamana: "సౌరమానం", amanta: "చాంద్రమానం (అమాంత)", purnimanta: "చాంద్రమానం (పూర్ణిమాంత)",
        lblMasamSuryamana: "సౌర మాసం", lblMasamAmanta: "అమాంత మాసం", lblMasamPurnimanta: "పూర్ణిమాంత మాసం"
      }
    };

    function setLanguage(lang) {
      if (lang === currentLang) return;
      currentLang = lang;
      const dict = i18n[lang];
      if (!dict) return;

      document.getElementById('langBtn').innerText = dict.langBtn;
      document.getElementById('subHeading').innerText = dict.subHeading;
      document.getElementById('lbl-samvatsaram').innerText = dict.lblSamvatsaram;
      document.getElementById('lbl-ayanam').innerText = dict.lblAyanam;
      document.getElementById('lbl-rithuvu').innerText = dict.lblRithuvu;
      document.getElementById('lbl-masam').innerText = dict.lblMasam;
      document.getElementById('lbl-paksham').innerText = dict.lblPaksham;
      document.getElementById('lbl-thidhi').innerText = dict.lblThidhi;
      document.getElementById('lbl-nakshatram').innerText = dict.lblNakshatram;
      document.getElementById('btnFullPanchangam').innerText = dict.btnFullPanchangam;
      
      document.getElementById('btn-suryamana').innerText = dict.suryamana;
      document.getElementById('btn-amanta').innerText = dict.amanta;
      document.getElementById('btn-purnimanta').innerText = dict.purnimanta;

      if (currentPanchangam) {
        renderPanchangam(currentPanchangam);
        populateModal(); 
      }
    }

    function getSpecialKalas(data) {
        if (!data || !data.kalas) return [];
        return [
            { id: 'brahma_muhurta', name: { en: 'Brahma Muhurta', te: 'బ్రహ్మ ముహూర్తం' }, time: data.kalas.brahma_muhurta || "---" },
            { id: 'durmuhurta', name: { en: 'Durmuhurta', te: 'దుర్ముహూర్తం' }, time: data.kalas.durmuhurta || "---" },
            { id: 'abhijit_muhurta', name: { en: 'Abhijit Lagnam', te: 'అభిజిత్ లగ్నం' }, time: data.kalas.abhijit_muhurta || "---" },
            { id: 'yamaganda', name: { en: 'Yamaganda', te: 'యమగండం' }, time: data.kalas.yamaganda || "---" },
            { id: 'gulika', name: { en: 'Gulika Kalam', te: 'గుళిక కాలం' }, time: data.kalas.gulika || "---" },
            { id: 'amrita_kala', name: { en: 'Amrita Kalam', te: 'అమృత కాలం' }, time: data.kalas.amrita_kala || "---" },
            { id: 'rahukalam', name: { en: 'Rahu Kalam', te: 'రాహు కాలం' }, time: data.kalas.rahukalam || "---" },
            { id: 'varjyam', name: { en: 'Varjyam', te: 'వర్జ్యం' }, time: data.kalas.varjyam || "---" }
        ];
    }

    async function loadPanchangam(dateStr) {
      try {
          const response = await fetch(`/api/panchangam?date=${dateStr}&calendar_type=${currentCalendarType}`);
          currentPanchangam = await response.json();
          renderPanchangam(currentPanchangam);
      } catch (err) {
          console.error("Error loading panchangam data.", err);
      }
    }

    function renderPanchangam(data) {
      if (!data) return;
      const lang = currentLang;
      
      document.getElementById("label_sunrise").innerText = i18n[lang].sunrise + " ";
      document.getElementById("label_sunset").innerText = i18n[lang].sunset + " ";
      document.getElementById("label_moonrise").innerText = i18n[lang].moonrise + " ";
      document.getElementById("label_moonset").innerText = i18n[lang].moonset + " ";
      document.getElementById("nav-sunrise").innerText = data.solar.sunrise;
      document.getElementById("nav-sunset").innerText = data.solar.sunset;
      document.getElementById("nav-moonrise").innerText = data.lunar.moonrise;
      document.getElementById("nav-moonset").innerText = data.lunar.moonset;

      document.getElementById("val-samvatsaram").innerText = data.general.samvatsara[lang];
      document.getElementById("val-ayanam").innerText = data.general.ayanam[lang];
      document.getElementById("val-rithuvu").innerText = data.general.ritu[lang];
      document.getElementById("val-masam").innerText = data.general.masa[lang];
      document.getElementById("val-paksham").innerText = data.general.paksha[lang];
      document.getElementById("val-thidhi").innerText = data.general.tithi[lang] + " " + data.general.tithi_till[lang];
      document.getElementById("val-nakshatram").innerText = data.general.nakshatra[lang] + " " + data.general.nakshatra_till[lang];
      document.getElementById("todayDateDisplay").textContent = data.date;
      document.getElementById("kalaChakraLabel").innerText = i18n[lang].kalaChakram;
      
      const specialKalas = getSpecialKalas(data);
      renderKalas(specialKalas);
    }

    function renderKalas(kalas) {
      const outerWheel = document.getElementById('outerWheel');
      if (!outerWheel) return;
      const existingSpokes = outerWheel.querySelectorAll('.time-spoke');
      existingSpokes.forEach(s => s.remove());

      kalas.forEach((kala, index) => {
        const angle = index * (360 / kalas.length);
        const spoke = document.createElement('div');
        spoke.className = 'time-spoke';
        
        const auspiciousIds = ['brahma_muhurta', 'abhijit_muhurta', 'amrita_kala'];
        if (auspiciousIds.includes(kala.id)) {
            spoke.classList.add('auspicious');
        } else {
            spoke.classList.add('inauspicious');
        }
        
        spoke.dataset.id = kala.id;
        spoke.style.transform = `rotate(${angle}deg)`;

        const content = document.createElement('div');
        content.className = 'upright-content';
        content.style.transform = `rotate(-${angle}deg)`;

        const title = document.createElement('span');
        title.className = 'label-title';
        
        let rawName = kala.name[currentLang];
        let nameParts = rawName.split(' ');
        if(nameParts.length === 2) {
            title.innerHTML = nameParts[0] + '<br>' + nameParts[1];
        } else if (nameParts.length > 2) {
            title.innerHTML = nameParts[0] + '<br>' + nameParts.slice(1).join(' ');
        } else {
            title.innerText = rawName;
        }

        const time = document.createElement('span');
        time.className = 'label-time';
        time.innerHTML = kala.time.split(' / ').join('<br>'); 

        content.appendChild(title);
        content.appendChild(time);
        spoke.appendChild(content);
        outerWheel.appendChild(spoke);
      });
    }

    function parseKalaTimeSafe(timeStr) {
        if (!timeStr || timeStr === "---" || timeStr === "—") return null;
        const parts = timeStr.trim().split(' ');
        if (parts.length < 2) return null;
        let [time, modifier] = parts;
        let [hours, minutes] = time.split(':');
        hours = parseInt(hours, 10);
        if (hours === 12) hours = 0;
        if (modifier.toUpperCase() === 'PM') hours += 12;
        const d = new Date();
        d.setHours(hours, parseInt(minutes, 10), 0, 0);
        return d;
    }

    function checkTimeInRange(now, startStr, endStr) {
        let start = parseKalaTimeSafe(startStr);
        let end = parseKalaTimeSafe(endStr);
        if (!start || !end) return false;
        if (end < start) {
           if (now < end) start.setDate(start.getDate() - 1);
           else end.setDate(end.getDate() + 1);
        }
        return now >= start && now < end;
    }

    function updateCelestialCycle() {
      if (!currentPanchangam) {
        requestAnimationFrame(updateCelestialCycle);
        return;
      }

      const now = new Date();
      const windowWidth = window.innerWidth;
      const celestialWidth = 80; 
      const startX = -celestialWidth;
      const endX = windowWidth;
      const totalDistance = endX - startX;

      const bgMorning = document.getElementById('bgMorning');
      const bgAfternoon = document.getElementById('bgAfternoon');
      const bgEvening = document.getElementById('bgEvening');
      const bgNight = document.getElementById('bgNight');
      const greetingHeading = document.getElementById('greetingHeading');
      const dict = i18n[currentLang];

      const sunIcon = document.getElementById('sunIcon');
      const moonContainer = document.getElementById('moonContainer');
      const moonShadow = document.getElementById('moonShadow');

      let sunrise = parseKalaTimeSafe(currentPanchangam.solar.sunrise);
      let sunset = parseKalaTimeSafe(currentPanchangam.solar.sunset);
      let solarNoon = parseKalaTimeSafe(currentPanchangam.solar.solar_noon);
      let mRise = parseKalaTimeSafe(currentPanchangam.lunar.moonrise);
      let mSet = parseKalaTimeSafe(currentPanchangam.lunar.moonset);

      bgMorning.classList.remove('active');
      bgAfternoon.classList.remove('active');
      bgEvening.classList.remove('active');
      bgNight.classList.remove('active');

      if (sunrise && sunset && solarNoon) {
          if (now >= sunrise && now <= sunset) {
              sunIcon.style.display = 'block';
              let sunProgress = (now - sunrise) / (sunset - sunrise);
              sunIcon.style.transform = `translateX(${startX + (sunProgress * totalDistance)}px)`;
          } else {
              sunIcon.style.display = 'none';
          }

          if (now >= sunrise && now < solarNoon) {
              bgMorning.classList.add('active');
              applyTheme('day');
              greetingHeading.innerText = dict.goodMorning;
          } else if (now >= solarNoon && now < sunset) {
              bgAfternoon.classList.add('active');
              applyTheme('day');
              greetingHeading.innerText = dict.goodAfternoon;
          } else {
              let eveningEnd = new Date(sunset.getTime() + 2 * 60 * 60 * 1000);
              if (now >= sunset && now < eveningEnd) {
                  bgEvening.classList.add('active');
                  applyTheme('night');
                  greetingHeading.innerText = dict.goodEvening;
              } else {
                  bgNight.classList.add('active');
                  applyTheme('night');
                  greetingHeading.innerText = dict.goodNight;
              }
          }
      }

      if (mRise && mSet) {
          if (mSet <= mRise) {
              if (now < mSet) mRise.setDate(mRise.getDate() - 1);
              else mSet.setDate(mSet.getDate() + 1);
          }
          
          if (now >= mRise && now <= mSet) {
              moonContainer.style.display = 'block';
              let moonProgress = (now - mRise) / (mSet - mRise);
              moonContainer.style.transform = `translateX(${startX + (moonProgress * totalDistance)}px)`;
              
              let illumination = currentPanchangam.lunar.moon_illumination;
              if (illumination === undefined) illumination = 50;
              moonShadow.style.transform = `translateX(${illumination}%)`;
          } else {
              moonContainer.style.display = 'none';
          }
      } else {
          moonContainer.style.display = 'none';
      }

      let activeKala = null;
      const kalas = getSpecialKalas(currentPanchangam);

      for (let i = 0; i < kalas.length; i++) {
        const kala = kalas[i];
        if (!kala.time || kala.time === "---") continue;
        const periods = kala.time.split(' / ');
        let isActive = false;
        for (let p of periods) {
            let parts = p.split(' – ').length === 2 ? p.split(' – ') : p.split(' - ');
            if(parts.length === 2 && checkTimeInRange(now, parts[0], parts[1])) {
                isActive = true;
                break;
            }
        }
        if (isActive) {
           activeKala = kala;
           break;
        }
      }

      document.querySelectorAll('.time-spoke').forEach(spoke => spoke.classList.remove('active-kala'));
      document.querySelectorAll('.kala-item').forEach(item => item.classList.remove('active-modal-kala'));

      const viewedDate = document.getElementById("selectedDate").value;
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const todayStr = `${y}-${m}-${day}`;
      const isToday = viewedDate === todayStr;

      if (activeKala && isToday) {
        const activeSpoke = document.querySelector(`.time-spoke[data-id="${activeKala.id}"]`);
        if (activeSpoke) activeSpoke.classList.add('active-kala');
        
        const activeModalItem = document.getElementById(`modal-kala-${activeKala.id}`);
        if (activeModalItem) activeModalItem.classList.add('active-modal-kala');
      }

      requestAnimationFrame(updateCelestialCycle);
    }

    function applyTheme(theme) {
      const navbar = document.getElementById('mainNavbar');
      const bookCard = document.getElementById('panchangamCard');
      const logoImg = document.querySelector('.logo-img');
      const omLogoImg = document.querySelector('.om-logo-img');
      const shloka = document.getElementById('shlokaText');

      if (theme === 'day') {
        navbar.classList.add('day-theme');
        navbar.classList.remove('night-theme');
        bookCard.classList.add('day-theme');
        bookCard.classList.remove('night-theme');
        shloka.classList.add('day-theme');
        shloka.classList.remove('night-theme');
      } else {
        navbar.classList.add('night-theme');
        navbar.classList.remove('day-theme');
        bookCard.classList.add('night-theme');
        bookCard.classList.remove('day-theme');
        shloka.classList.add('night-theme');
        shloka.classList.remove('day-theme');
        logoImg.setAttribute('src', '/static/Logo_White.webp');
        omLogoImg.setAttribute('src', '/static/Om_Logo_White.webp');
      }
    }

    function startRealTimeClock() {
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit'});
            const dateStr = now.toLocaleDateString('en-US', { day: '2-digit', month: 'short' });
            const yearStr = now.getFullYear();
            
            const clockEl = document.getElementById('clockTime');
            if(clockEl) clockEl.innerText = timeStr;
            
            const clockDateEl = document.getElementById('clockDate');
            if(clockDateEl) clockDateEl.innerText = dateStr;
        }
        updateClock();
        setInterval(updateClock, 1000);
    }

    function scaleCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        const splash = document.getElementById('splash-screen');
        const targetWidth = 1672;
        const targetHeight = 941;
        const scaleX = window.innerWidth / targetWidth;
        const scaleY = window.innerHeight / targetHeight;
        const scale = Math.min(scaleX, scaleY);
        wrapper.style.transform = `scale(${scale})`;
        splash.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', scaleCanvas);
    window.addEventListener("DOMContentLoaded", async () => {
      scaleCanvas();
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("selectedDate").value = today;
      await loadPanchangam(today);
      startRealTimeClock();
      requestAnimationFrame(updateCelestialCycle);
    });

    document.getElementById("selectedDate").addEventListener("change", async (e) => {
      await loadPanchangam(e.target.value);
    });

    // --- Modal Logic & WebP Navigation ---
    function populateModal() {
        if(!currentPanchangam) return;
        const data = currentPanchangam;
        const lang = currentLang;
        const dict = i18n[lang];
        const specialKalas = getSpecialKalas(data);
        const kalasHtml = specialKalas.map(k => `
            <div class="kala-item" id="modal-kala-${k.id}">
                <span class="kala-name">${k.name[lang]}</span>
                <span>${k.time.split(' / ').join('<br>')}</span>
            </div>
        `).join('');

        let panchangamLeftPageHeading = lang === 'te' ? "సమయాలు" : "Timings & Kalas";
        let sunriseLabel = lang === 'te' ? "సూర్యోదయం" : "Sunrise";
        let sunsetLabel = lang === 'te' ? "సూర్యాస్తమయం" : "Sunset";
        let monriseLabel = lang === 'te' ? "చంద్రోదయం" : "Moonrise";
        let moonsetLabel = lang === 'te' ? "చంద్రాస్తమయం" : "Moonset";
        
        let masamLabel = dict.lblMasamSuryamana;
        if (currentCalendarType === 'amanta') masamLabel = dict.lblMasamAmanta;
        else if (currentCalendarType === 'purnimanta') masamLabel = dict.lblMasamPurnimanta;

        document.getElementById("panchangamLeftPage").innerHTML = `
        <div style="text-align:center; color: #800000; font-weight: 900; margin-bottom: 5px; font-size: 16px;">${data.date}</div>
        <h2 style="color: #5a3d06; text-align: center; margin-bottom: 10px; border-bottom: 2px solid #d4af37; padding-bottom: 5px;">${panchangamLeftPageHeading}</h2>
        <table class="book-table" style="margin-bottom: 15px;">
            <tr><td>${sunriseLabel}</td><td>${data.solar.sunrise}</td></tr>
            <tr><td>${sunsetLabel}</td><td>${data.solar.sunset}</td></tr>
            <tr><td>${monriseLabel}</td><td>${data.lunar.moonrise}</td></tr>
            <tr><td>${moonsetLabel}</td><td>${data.lunar.moonset}</td></tr>
        </table>
        <div class="kala-grid">${kalasHtml}</div>
        `;

        document.getElementById("panchangamRightPage").innerHTML = `
        <div style="text-align:center; color: #800000; font-weight: 900; margin-bottom: 5px; font-size: 16px;">${data.date}</div>
        <h2 style="color: #5a3d06; text-align: center; margin-bottom: 10px; border-bottom: 2px solid #d4af37; padding-bottom: 5px;">Panchangam Details</h2>
        <table class="book-table">
            <tr><td>Samvatsaram</td><td>${data.general.samvatsara[lang]}</td></tr>
            <tr><td>Ayanam</td><td>${data.general.ayanam[lang]}</td></tr>
            <tr><td>Rithuvu</td><td>${data.general.ritu[lang]}</td></tr>
            <tr><td>${masamLabel}</td><td>${data.general.masa[lang]}</td></tr>
            <tr><td>Paksham</td><td>${data.general.paksha[lang]}</td></tr>
            <tr><td>Thidhi</td><td>${data.general.tithi[lang] + " " + data.general.tithi_till[lang]}</td></tr>
            <tr><td>Nakshatram</td><td>${data.general.nakshatra[lang] + " " + data.general.nakshatra_till[lang]}</td></tr>
            <tr><td>Yogam</td><td>${data.general.yoga[lang] + " " + data.general.yoga_till[lang]}</td></tr>
            <tr><td>Karanam</td><td>${data.general.karana[lang] + " " + data.general.karana_till[lang]}</td></tr>
        </table>
        `;
    }

    document.getElementById("btnFullPanchangam").addEventListener("click", () => {
        document.getElementById("panchangamModal").style.display = "flex";
        document.getElementById("panchangamLeftPage").style.opacity = '0';
        document.getElementById("panchangamRightPage").style.opacity = '0';
        
        const splash = document.getElementById('splash-screen');
        splash.style.backgroundImage = `url('/static/PanchangamOpening.webp?v=${new Date().getTime()}')`;
        splash.style.display = 'block';
        splash.style.opacity = '1';

        setTimeout(() => {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                const wrapper = document.getElementById('canvas-wrapper');
                wrapper.style.backgroundImage = "url('/static/PanchangamOpenFull.webp')";
                populateModal();
                document.getElementById('panchangamLeftPage').style.opacity = '1';
                document.getElementById('panchangamRightPage').style.opacity = '1';
                isOpeningComplete = true;
            }, 0); 
        }, 7000); 
    });

    async function navigateCalendarType(type) {
        if (!isOpeningComplete || currentCalendarType === type) return;

        if (currentTimeout) {
            clearTimeout(currentTimeout);
            currentTimeout = null;
        }

        currentCalendarType = type;
        
        document.querySelectorAll('.bottom-bar .btn-time').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + type).classList.add('active');

        let currentDateStr = document.getElementById("selectedDate").value;

        const wrapper = document.getElementById('canvas-wrapper');
        const leftBox = document.getElementById('panchangamLeftPage');
        const rightBox = document.getElementById('panchangamRightPage');
        
        leftBox.style.opacity = '0';
        rightBox.style.opacity = '0';

        await loadPanchangam(currentDateStr);

        let transitionImage = '/static/PagesLeftToRight.webp';
        wrapper.style.backgroundImage = `url('${transitionImage}?v=${new Date().getTime()}')`;
        
        currentTimeout = setTimeout(() => {
            wrapper.style.backgroundImage = "url('/static/PanchangamOpenFull.webp')";
            populateModal();
            leftBox.style.opacity = '1';
            rightBox.style.opacity = '1';
            currentTimeout = null;
        }, 4500); 
    }

    async function navigateModalDay(offset) {
        if (!isOpeningComplete && offset !== 0) return;

        if (currentTimeout) {
            clearTimeout(currentTimeout);
            currentTimeout = null;
        }

        let currentDateStr = document.getElementById("selectedDate").value;
        if (!currentDateStr) return;
        let d = new Date(currentDateStr);
        d.setDate(d.getDate() + offset);
        
        let y = d.getFullYear();
        let m = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        let newDateStr = `${y}-${m}-${day}`;
        
        document.getElementById("selectedDate").value = newDateStr;

        const wrapper = document.getElementById('canvas-wrapper');
        const leftBox = document.getElementById('panchangamLeftPage');
        const rightBox = document.getElementById('panchangamRightPage');

        let transitionImage = '';
        if (offset === -1) {
            transitionImage = '/static/PagesRightToLeft.webp';
        } else if (offset === 1) {
            transitionImage = '/static/PagesLeftToRight.webp';
        }

        leftBox.style.opacity = '0';
        rightBox.style.opacity = '0';

        await loadPanchangam(newDateStr);

        if (transitionImage !== '') {
            wrapper.style.backgroundImage = `url('${transitionImage}?v=${new Date().getTime()}')`;
            currentTimeout = setTimeout(() => {
                wrapper.style.backgroundImage = "url('/static/PanchangamOpenFull.webp')";
                populateModal();
                leftBox.style.opacity = '1';
                rightBox.style.opacity = '1';
                currentTimeout = null;
            }, 4500); 
        } else {
            wrapper.style.backgroundImage = "url('/static/PanchangamOpenFull.webp')";
            populateModal();
            leftBox.style.opacity = '1';
            rightBox.style.opacity = '1';
            currentTimeout = null;
        }
    }

    document.getElementById("closeModal").onclick = function() {
        document.getElementById("panchangamModal").style.display = "none";
        isOpeningComplete = false;
        if (currentTimeout) {
            clearTimeout(currentTimeout);
            currentTimeout = null;
        }
    };
  </script>
</body>
</html>
